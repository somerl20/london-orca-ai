<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 420">
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .title { font-size: 26px; font-weight: 800; fill: #172033; }
    .label { font-size: 15px; font-weight: 700; fill: #172033; }
    .sub { font-size: 12px; fill: #647084; }
    .tiny { font-size: 11px; fill: #647084; }
    .node { fill: #fff; stroke: #d4ddeb; stroke-width: 1.5; }
    .node.blue { stroke: #2563eb; }
    .node.green { stroke: #16a34a; }
    .node.orange { stroke: #f26b21; }
    .node.purple { stroke: #7c3aed; }
    .node.teal { stroke: #0f9f9a; }
    .topbar.blue { fill: #2563eb; }
    .topbar.green { fill: #16a34a; }
    .topbar.orange { fill: #f26b21; }
    .topbar.purple { fill: #7c3aed; }
    .topbar.teal { fill: #0f9f9a; }
    .arrow { stroke: #aab7ca; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    .arrow.good { stroke: #16a34a; marker-end: url(#arrow-good); }
    .arrow.warn { stroke: #b7791f; stroke-dasharray: 6 5; marker-end: url(#arrow-warn); }
    .arrow.retry { stroke: #f26b21; stroke-dasharray: 3 4; marker-end: url(#arrow-retry); }
    .arrow.bad { stroke: #dc2626; stroke-dasharray: 7 5; marker-end: url(#arrow-bad); }
    .badge { fill: #eef3fa; stroke: #ccd6e5; stroke-width: 1; }
    .badge-text { font-size: 11px; font-weight: 800; fill: #40506a; }
  </style>
  <defs>
