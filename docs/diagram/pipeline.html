<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pipeline Diagrams</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --ink: #172033;
      --muted: #647084;
      --line: #aab7ca;
      --panel: #ffffff;
      --blue: #2563eb;
      --green: #16a34a;
      --orange: #f26b21;
      --purple: #7c3aed;
      --teal: #0f9f9a;
      --red: #dc2626;
      --amber: #b7791f;
      --gray: #667085;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      display: grid;
      gap: 18px;
      max-width: 1500px;
      margin: 0 auto;
      padding: 22px;
    }

    section {
      overflow-x: auto;
      border: 1px solid #dde5f1;
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    svg.diagram {
      display: block;
      min-width: 1160px;
      width: 100%;
      height: auto;
    }

    .title {
      font-size: 26px;
      font-weight: 800;
      fill: var(--ink);
    }

    .label {
      font-size: 15px;
      font-weight: 760;
      fill: var(--ink);
    }

    .sub {
      font-size: 12px;
      fill: var(--muted);
    }

    .tiny {
      font-size: 11px;
      fill: var(--muted);
    }

    .decision-text {
      font-size: 15px;
      font-weight: 800;
      fill: var(--ink);
    }

    .node {
      fill: #fff;
      stroke: #d4ddeb;
      stroke-width: 1.5;
      rx: 8;
    }

    .node.blue { stroke: var(--blue); }
    .node.green { stroke: var(--green); }
    .node.orange { stroke: var(--orange); }
    .node.purple { stroke: var(--purple); }
    .node.teal { stroke: var(--teal); }
    .node.red { stroke: var(--red); }
    .node.amber { stroke: var(--amber); }
    .node.gray { stroke: var(--gray); }

    .topbar.blue { fill: var(--blue); }
    .topbar.green { fill: var(--green); }
    .topbar.orange { fill: var(--orange); }
    .topbar.purple { fill: var(--purple); }
    .topbar.teal { fill: var(--teal); }
    .topbar.red { fill: var(--red); }
    .topbar.amber { fill: var(--amber); }
    .topbar.gray { fill: var(--gray); }

    .arrow {
      stroke: var(--line);
      stroke-width: 2.4;
      fill: none;
      marker-end: url(#arrow);
    }

    .arrow.good {
      stroke: var(--green);
      marker-end: url(#arrow-good);
    }

    .arrow.warn {
      stroke: var(--amber);
      stroke-dasharray: 6 5;
      marker-end: url(#arrow-warn);
    }

    .arrow.retry {
      stroke: var(--orange);
      stroke-dasharray: 3 4;
      marker-end: url(#arrow-retry);
    }

    .arrow.bad {
      stroke: var(--red);
      stroke-dasharray: 7 5;
      marker-end: url(#arrow-bad);
    }

    .badge {
      fill: #eef3fa;
      stroke: #ccd6e5;
      stroke-width: 1;
      rx: 13;
    }

    .badge-text {
      font-size: 11px;
      font-weight: 800;
      fill: #40506a;
    }

    .lane {
      fill: #fafcff;
      stroke: #e2e8f2;
      stroke-width: 1;
      rx: 8;
    }

    .icon-bg {
      fill: #f4f7fb;
      stroke: #dce5f1;
      stroke-width: 1;
    }
  </style>
</head>
