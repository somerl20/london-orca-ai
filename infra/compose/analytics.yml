# Analytics — Spark Thrift Server + Metabase
# Combine with core: docker-compose -f infra/compose/core.yml -f infra/compose/analytics.yml up

services:

  # ─── Spark Thrift Server (JDBC endpoint for Metabase → Delta Lake) ────────────
  spark-thrift:
    build: ../../warehouse/spark-thrift
    ports:
      - "10000:10000"  # JDBC → Metabase: host=localhost port=10000
    volumes:
      - delta-warehouse:/data/warehouse
    environment:
      WAREHOUSE_PATH: "/data/warehouse"
    restart: on-failure

  # ─── Metabase ─────────────────────────────────────────────────────────────────
  metabase:
    image: metabase/metabase:latest
    ports:
      - "3001:3000"   # UI → http://localhost:3001
    depends_on:
      - spark-thrift
    volumes:
      - metabase-data:/metabase-data
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
    restart: on-failure

volumes:
  delta-warehouse:
  metabase-data:

networks:
  default:
    name: pipeline-network
